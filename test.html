<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gold and Silver Rate</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Live Gold Rate</h2>

    <!-- Table to display commodity rates -->
    <h3>Live Gold and Silver Rate</h3>
    <table id="liveRates">
        <thead>
            <tr>
                <th>COMMODITY</th>
                <th>SELLING</th>
                <th>BUYING</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be dynamically populated here -->
        </tbody>
    </table>

    <!-- Table to display detailed gold rates -->
    <h3>GOLD RATE</h3>
    <table id="goldRates">
        <thead>
            <tr>
                <th>COMMODITY</th>
                <th>BID</th>
                <th>ASK</th>
                <th>HIGH</th>
                <th>LOW</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be dynamically populated here -->
        </tbody>
    </table>

    <script>
        // Function to parse and update the tables
        function updateRates() {
            fetch('http://bcast.surabibullion.net:7767/VOTSBroadcastStreaming/Services/xml/GetLiveRateByTemplateID/surabi')
                .then(response => response.text())
                .then(data => {
                    // Parse XML data
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data, 'text/xml');
                    
                    // Update Live Gold and Silver Rates
                    const liveRatesTable = document.getElementById('liveRates').getElementsByTagName('tbody')[0];
                    liveRatesTable.innerHTML = ''; // Clear existing rows

                    const liveRates = xmlDoc.getElementsByTagName('row');
                    Array.from(liveRates).forEach(row => {
                        const commodity = row.cells[1].textContent;
                        const selling = row.cells[2].textContent;
                        const buying = row.cells[3].textContent;

                        if (commodity === 'BAR 9999 NOV 25' || commodity === 'Coswan Silver 9999') {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${commodity}</td>
                                <td>${selling}</td>
                                <td>${buying}</td>
                            `;
                            liveRatesTable.appendChild(tr);
                        }
                    });

                    // Update Gold Rate Table
                    const goldRatesTable = document.getElementById('goldRates').getElementsByTagName('tbody')[0];
                    goldRatesTable.innerHTML = ''; // Clear existing rows

                    const goldRates = xmlDoc.getElementsByTagName('row');
                    Array.from(goldRates).forEach(row => {
                        const commodity = row.cells[1].textContent;
                        const bid = row.cells[2].textContent;
                        const ask = row.cells[3].textContent;
                        const high = row.cells[4].textContent;
                        const low = row.cells[5].textContent;

                        if (commodity === 'GOLD($)' || commodity === 'SILVER' || commodity === 'INR' || commodity === 'GOLD ₹' || commodity === 'SILVER ₹') {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${commodity}</td>
                                <td>${bid}</td>
                                <td>${ask}</td>
                                <td>${high}</td>
                                <td>${low}</td>
                            `;
                            goldRatesTable.appendChild(tr);
                        }
                    });
                })
                .catch(error => console.error('Error fetching the data:', error));
        }

        // Fetch data every 5 seconds
        setInterval(updateRates, 5000);

        // Initial data load
        updateRates();
    </script>

</body>
</html>
