<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Catalogue Maker</title>
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
       <!-- Loader -->
    <div id="loader" class="fixed inset-0 flex items-center justify-center bg-white z-50">
        <div class="w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <main class="min-h-screen container hidden" id="content">
      <header>
        <nav class="py-10">
          <!-- Parent container with responsive flex settings -->
          <div class="flex flex-col gap-10  lg:flex-row lg:items-center relative">
            <!-- Logo -->
            <div class="relative  lg:mr-4 lg:flex-shrink-0">
              <a href="/">
                <img
                  class="h-24 mx-auto"
                  width="165"
                  height="127"
                  src="assets/images/logo.svg"
                  alt="Logo"
                />
              </a>
            </div>
      
            <!-- Text -->
            <div class="text-2xl lg:text-3xl w-full font-semibold text-center lg:absolute lg:top-1/2 lg:left-1/2 lg:-translate-x-1/2 lg:-translate-y-1/3 px-4 lg:max-w-[70%]">
              Catalogue Maker
            </div>
          </div>
        </nav>
      </header>
      
      

      <section>
        <div
          class="flex flex-col lg:flex-row gap-10 items-center justify-center min-h-[60vh]"
        >
          <div>
            <a href="catalogue.html" class="main-btn"
              >General Catalogue
              <span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"
                  />
                </svg> </span
            ></a>
          </div>
          <div>
            <a href="catalogue.html" class="main-btn"
              >custom Catalogue
              <span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"
                  />
                </svg> </span
            ></a>
          </div>

          <div>
            <a href="db-catalogue.html" class="main-btn"
              >Database Catalogue
              <span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"
                  />
                </svg> </span
            ></a>
          </div>
        </div>
      </section>
    </main>


    <script>
      window.addEventListener("load", function () {
            setTimeout(() => {
                document.getElementById("loader").style.display = "none";
                document.getElementById("content").classList.remove("hidden");
            }, 2000); // Hide loader after 2 seconds
        });

    </script>
  </body>
</html>
